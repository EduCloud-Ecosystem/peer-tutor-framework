name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Workstream A: the suite must pass on BOTH store backends.
  test:
    name: test (${{ matrix.store }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qi
          POSTGRES_PASSWORD: qi
          POSTGRES_DB: qimvp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-packs.txt
          python -m spacy download en_core_web_sm

      - name: Run suite (SQLite — zero-config default)
        if: matrix.store == 'sqlite'
        working-directory: backend
        run: python -m pytest -q

      - name: Run suite (Postgres — opt-in via DATABASE_URL)
        if: matrix.store == 'postgres'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://qi:qi@localhost:5432/qimvp
        run: python -m pytest -q

  # Slice H quality gate: lint + format-check + type-check, ONCE (not per db leg).
  quality:
    name: quality (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-packs.txt
          python -m spacy download en_core_web_sm

      - name: ruff check (lint)
        working-directory: backend
        run: ruff check .

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .

      - name: mypy (type-check)
        working-directory: backend
        run: mypy