# Tooling config for the peer-tutor-framework backend (Slice H CI quality gate).
# This file configures DEV TOOLING ONLY (ruff, mypy). It declares no build system and
# adds no runtime dependency; the package is still run/tested as today.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build"]

[tool.ruff.lint]
# A pragmatic, low-churn rule set: pyflakes (F), pycodestyle errors/warnings (E, W),
# import sorting (I), pyupgrade (UP), and a subset of bugbear (B).
select = ["E", "F", "W", "I", "UP", "B"]
# Each ignore below is a NARROW, documented exclusion (Slice H: no behavior change, no
# logic edits to satisfy the linter). The gate still catches new lint going forward.
ignore = [
    # E501 (line length): the codebase deliberately uses long persona/prompt string
    # literals and explanatory comments that are not safely auto-wrappable, and
    # `ruff format` does not split string literals. Enforcing it would force rewrites.
    "E501",
    # E402 (import not at top): a few modules import deliberately late — e.g. main.py
    # mounts the Quad router AFTER constructing `app`, and the registry/orchestrator use
    # intentional function-local-then-module imports. Reordering would change semantics.
    "E402",
    # E741 (ambiguous name `l`): occurs only as throwaway comprehension bindings in
    # tests; renaming is cosmetic and out of this slice's no-edit scope.
    "E741",
    # B008 (call in default arg): FastAPI's `= Body(...)` / `= Depends(...)` route idiom
    # uses callable defaults by design; this is a known false positive for FastAPI.
    "B008",
    # B904 (raise ... from) is ENFORCED as of Slice I — each raise inside an except now
    # chains (`from err`) or deliberately suppresses (`from None`), per site.
    # UP031 (printf %-format) and UP038 (isinstance union) rewrite RUNTIME expressions at
    # logic sites; excluded to keep the autofix strictly to annotations/imports/layout.
    "UP031",
    "UP038",
]

[tool.mypy]
# Pragmatic baseline — NOT strict (Slice H). The gate proves internal type consistency
# of our code and catches new type errors going forward; full annotation is a later
# ratchet (raise strictness incrementally). Run on py3.12 (the CI Python).
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Fix Mypy module path resolution ambiguity across root package boundaries
explicit_package_bases = true
mypy_path = "."

# Slice I: the GLOBAL `ignore_missing_imports` is removed so a missing/mistyped
# FIRST-PARTY import now errors (teeth). Genuinely stubless third-party libs get a
# narrow per-module override below; libs that ship stubs get `types-*` in
# requirements-dev.txt instead.
files = ["app", "tests", "evals"]
# `_child.py` is the sandbox child harness: it deliberately monkeypatches `socket`
# (assign-to-a-type) to disable the network, which is not meaningfully type-checkable
# and has no in-process callers to type against. Excluded with reason (narrow, not
# `ignore_errors`). Everything else under app/ is gated.
exclude = "(^|/)(\\.venv|build)/|/_child\\.py$"

# Slice I strictness notch (one notch, not strict), applied to APP SOURCE ONLY: check
# the bodies of untyped functions and flag returning Any from a typed function. It is
# scoped to `app.*` (an importable package) rather than relaxed on tests, so pytest
# fixtures / monkeypatching / stub doubles in tests+evals stay at the base level and do
# not drown the signal. The NEXT ratchet notch is full annotation
# (`disallow_untyped_defs`), deferred, app-first.
[[tool.mypy.overrides]]
module = ["app.*"]
check_untyped_defs = true
warn_return_any = true